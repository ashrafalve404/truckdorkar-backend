services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truckdorkar-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    restart: always

volumes:
  uploads_data:
